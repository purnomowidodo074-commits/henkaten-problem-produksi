name: Deploy to InsForge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login to InsForge
        run: npx @insforge/cli login --user-api-key ${{ secrets.INSFORGE_USER_API_KEY }}

      - name: Link InsForge project
        run: npx @insforge/cli link --project-id a89a8c87-f634-48ab-a8c3-a0e107f4fdd9 -y

      - name: Deploy to InsForge
        run: npx @insforge/cli deployments deploy .
